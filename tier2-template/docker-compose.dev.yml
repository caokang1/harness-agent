# {{PROJECT_NAME}} 开发环境 docker-compose
# 来源：harness-starter / Tier 2 模板
#
# 使用：bash dev.sh start
#
# 占位符（init.sh 替换）：
#   {{PROJECT_NAME}}      项目名（用于服务名）
#   {{BACKEND_PORT}}      后端端口（默认 8080）
#   {{FRONTEND_PORT}}     前端端口（默认 5173）
#   {{BOOT_RUN_CMD}}      启动入口模块的命令（Gradle：gradle :start:bootRun；Maven：mvn -pl start spring-boot:run）
#   {{FRONTEND_DIR}}      前端仓库路径（如 ../my-service-ui）
#   {{JDK_IMAGE}}         构建镜像（Gradle 默认 gradle:8.12-jdk21，Maven 默认 maven:3.9-eclipse-temurin-21）
#   {{BUILD_CACHE_DIR}}   依赖缓存目录（Gradle /root/.gradle，Maven /root/.m2）

services:

  # ============================================================
  # 后端：Spring Boot（{{BUILD_TOOL}}，DevTools 热重载）
  # ============================================================
  {{PROJECT_NAME}}-dev:
    image: {{JDK_IMAGE}}
    container_name: {{PROJECT_NAME}}-dev
    working_dir: /workspace
    volumes:
      - ./:/workspace
      # 依赖缓存（避免每次重启重新下载依赖）
      - {{PROJECT_NAME}}-build-cache:{{BUILD_CACHE_DIR}}
    ports:
      # 容器内外用同一个端口，并用 SERVER_PORT 让 Spring 监听它（不再假设应用跑在 8080）
      - "{{BACKEND_PORT}}:{{BACKEND_PORT}}"
    # 项目根的 .env 里可以放数据库地址等环境变量；没有这个文件也能启动（需要 Docker Compose 2.24+）
    env_file:
      - path: .env
        required: false
    environment:
      - SERVER_PORT={{BACKEND_PORT}}
      - JAVA_TOOL_OPTIONS=-XX:-OmitStackTraceInFastThrow
      - SPRING_DEVTOOLS_RESTART_ENABLED=true
    command: >
      bash -c "
        cd /workspace &&
        {{BOOT_RUN_CMD}}
      "
    networks:
      - {{PROJECT_NAME}}-net

  # >>> frontend（纯后端项目 init.sh 会删掉这两行标记之间的内容）
  # ============================================================
  # 前端：Vue 3 + Vite dev server (HMR)
  # ============================================================
  {{PROJECT_NAME}}-ui-dev:
    image: node:20-alpine
    container_name: {{PROJECT_NAME}}-ui-dev
    working_dir: /workspace
    volumes:
      - {{FRONTEND_DIR}}:/workspace
      - {{PROJECT_NAME}}-npm-cache:/root/.npm
    ports:
      - "{{FRONTEND_PORT}}:5173"
    command: >
      sh -c "
        cd /workspace &&
        npm install &&
        npm run dev -- --host 0.0.0.0
      "
    networks:
      - {{PROJECT_NAME}}-net
  # <<< frontend

# ============================================================
# 卷与网络
# ============================================================

volumes:
  {{PROJECT_NAME}}-build-cache:
  # >>> frontend
  {{PROJECT_NAME}}-npm-cache:
  # <<< frontend

networks:
  {{PROJECT_NAME}}-net:
    driver: bridge
