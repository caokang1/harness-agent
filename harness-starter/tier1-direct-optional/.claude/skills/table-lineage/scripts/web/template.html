<style>

:root[data-theme="dark"]{
  --bg:#11171a; --panel:#182126; --sunk:#141c20; --fg:#e2e9eb; --muted:#94a4aa; --faint:#6d7c82; --line:#2a363b;

<script>
const D = __DATA__;
const ACC = __ACC__;
const S = D.S, E = D.entries, T = D.tables;
const M = D.meta || {}, SRC = M.source || '元数据';
const FLOW = D.flow || {biz: [], biz_db: [], rt: [], job: [], report_db: [], ext: [], xxl: false, cdc: false};
const EXT_LABEL = FLOW.ext.length ? `外部查询接口（${FLOW.ext.join(' / ')}）` : '外部查询接口';
const byKey = new Map(T.map(t => [t.k, t]));
const byName = new Map(); T.forEach(t => { if (!byName.has(t.t)) byName.set(t.t, []); byName.get(t.t).push(t); });
const KINDS = [['业务底表','--k-base'],['报表','--k-report'],['中间表','--k-mid'],['代码无引用','--k-dead'],['备份/临时','--k-bak'],['基础设施','--k-infra']];
const STATUS = [['在用','--ok','有生效的写入方，也有人在读'],['写而不读','--warn','仍在写，但除校验 Job 外没有读取方'],['无实时写入·调度未启用','--idle','没有生效的实时监听，写它的 Job 在调度系统里未启用或未配置'],['无生效写入方','--bad','写入代码已注释或不存在']];
const HOW = {canal:['binlog 实时订阅','--e-cdc'], forward:['binlog 经内部 topic 转发','--e-fwd'], sql:['SQL 直接读','--e-sql'], feign:['经 Feign 接口读','--e-feign'], feign_deep:['接口深层顺带读','--e-feign']};
const TIER = {canal:0, forward:1, sql:2, feign:3, feign_deep:4};
const DOMS = D.kb.domains;
const DOM_ORDER = DOMS.map(d => d[0]);
const GLOSS = D.kb.glossary.terms;
const GLOSS_TERMS = D.kb.glossary.inline;
const kc = k => `var(${(KINDS.find(x => x[0] === k) || KINDS[0])[1]})`;
const sc = s => `var(${(STATUS.find(x => x[0] === s) || ['', '--faint'])[1]})`;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const state = {view:'overview', dom:'', kinds:new Set(['报表','中间表']), st:'', db:'', q:'', reviewed:false, sort:'readers', sel:null, dtab:'ov', erTenant:false,
  chainFeign:false, api:{tab:'eps', q:'', onlyReport:true, mod:''}, iss:{q:'', dom:'', onlyVer:false}};
const primarySrc = t => t.src.filter(s => s[1] !== 'feign_deep');

function gloss(text){
  let h = esc(text);
  GLOSS_TERMS.forEach(([term, def]) => {
    const re = new RegExp('(^|[^\\w=!])(' + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')(?![\\w])', 'g');
    h = h.replace(re, (m, a, b) => `${a}<abbr title="${esc(def)}">${b}</abbr>`);
  });
  return h;
}
function resolve(q){ const t = byKey.get(q); if (t) return t; const c = byName.get(String(q).split('.').pop()); return c ? c[0] : null; }
function tlink(k, label){ const t = resolve(k); return t ? `<button class="tlink" data-go="${esc(t.k)}" title="${esc(t.c || t.k)}">${esc(label || t.k)}</button>` : `<span class="mono">${esc(label || k)}</span>`; }
function chip(k){ const t = resolve(k); return t ? `<button class="chip" data-go="${esc(t.k)}" style="border-left-color:${kc(t.kind)}" title="${esc(t.kind)}${t.c ? ' · ' + esc(t.c) : ''}">${esc(t.k)}</button>` : `<span class="chip">${esc(k)}</span>`; }
function copyBtn(text){ return `<button class="copy" data-copy="${esc(text)}" title="复制路径">复制</button>`; }
function ePill(e){ return `<span class="kb ${e.kind}">${{kafka:'实时监听',http:'HTTP',sched:'定时',kafka_off:'已注释监听'}[e.kind]}</span>`; }

function foldList(id, items, render, limit){
  limit = limit || 6;

/* ---------------- routing */
function setView(v, push){
  state.view = v;
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.view === v));
  ({overview: renderOverview, catalog: renderCatalog, api: renderApi, issues: renderIssues, er: renderER, glossary: renderGlossary, method: renderMethod})[v]();
  if (push !== false) { try { history.replaceState(null, '', v === 'catalog' && state.sel ? '#' + state.sel : '#' + v); } catch (e) {} }
  if (v !== 'catalog') window.scrollTo(0, 0);
}

function runBanner(){

/* ---------------- catalog */
function filtered(){
  const q = state.q.toLowerCase();
  const rs = T.filter(t => state.kinds.has(t.kind) && (!state.dom || t.dom === state.dom) && (!state.st || t.st === state.st) && (!state.db || t.db === state.db)
    && (!state.reviewed || t.card) && (!q || t.k.toLowerCase().includes(q) || (t.c || '').toLowerCase().includes(q)));
  const by = {readers: (a, b) => (b.next + b.nint) - (a.next + a.nint) || a.k.localeCompare(b.k), name: (a, b) => a.t.localeCompare(b.t), rows: (a, b) => b.rows - a.rows,
    status: (a, b) => STATUS.findIndex(s => s[0] === a.st) - STATUS.findIndex(s => s[0] === b.st) || a.t.localeCompare(b.t)}[state.sort];
  return rs.sort(by);
}

function select(k, tab){
  const t = byKey.get(k); if (!t) return;
  state.sel = k; if (tab) state.dtab = tab;
  if (!state.kinds.has(t.kind)) state.kinds.add(t.kind);

  else { document.querySelectorAll('#rows .row').forEach(b => b.classList.toggle('sel', b.dataset.k === k)); renderDetail(); }

}

/* ---------------- issues */
function renderIssues(){
  const st = state.iss, q = st.q.toLowerCase();
  let rows = T.filter(t => t.card).flatMap(t => t.card.risks.map(r => ({t, text: r[0], ver: r[1]})));
  const total = rows.length, verTotal = rows.filter(r => r.ver).length;
  if (st.onlyVer) rows = rows.filter(r => r.ver);
  if (st.dom) rows = rows.filter(r => r.t.dom === st.dom);
  if (q) rows = rows.filter(r => r.text.toLowerCase().includes(q) || r.t.k.includes(q));
  rows.sort((a, b) => (b.ver - a.ver) || DOM_ORDER.indexOf(a.t.dom) - DOM_ORDER.indexOf(b.t.dom) || a.t.k.localeCompare(b.t.k));
  const doms = [...new Set(T.filter(t => t.card).map(t => t.dom))].sort((a, b) => DOM_ORDER.indexOf(a) - DOM_ORDER.indexOf(b));
  const groups = new Map(); rows.forEach(r => { const k = r.t.k; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(r); });
  document.getElementById('main').innerHTML = `<div class="stack">
    <div><h1>问题清单</h1><p class="lede">来自人工逐张核对时在代码里看到的风险和 bug，共 ${total} 条。标红的 ${verTotal} 条已经由主会话回到代码逐行确认；其余为核对代理报告，尚未复查。每条都带 文件:行号，可以直接去代码里看。</p></div>
    <div class="filters"><input type="search" id="iq" placeholder="按关键词或表名筛选，如 NPE、并发、重复" value="${esc(st.q)}"><select id="idom"><option value="">全部业务域</option>${doms.map(d => `<option ${st.dom===d?'selected':''}>${esc(d)}</option>`).join('')}</select><label><input type="checkbox" id="iver" ${st.onlyVer ? 'checked' : ''}> 只看已确认</label><span class="muted" style="font-size:12px">${rows.length} 条 · ${groups.size} 张表</span></div>

  m.querySelector('#idom').onchange = e => { st.dom = e.target.value; renderIssues(); };
  m.querySelector('#iver').onchange = e => { st.onlyVer = e.target.checked; renderIssues(); };

/* ---------------- ER */
function renderER(){
  const MC = D.er.tenant_column || '';
  const er = {tables: D.er.tables, rels: D.er.rels.filter(r => state.erTenant || !MC || (r.ca !== MC && r.cb !== MC))};
  const hidden = D.er.rels.length - er.rels.length;
  const groups = {};
  er.tables.forEach(t => { const db = t.k.split('.')[0]; (groups[db] = groups[db] || []).push(t); });
  const order = (D.er.db_order && D.er.db_order.length ? D.er.db_order : Object.keys(groups)).filter(d => groups[d]).concat(Object.keys(groups).filter(d => !(D.er.db_order || []).includes(d)));
  const colW = 210, gap = 70, boxW = 196;
  const relCols = new Map(); er.rels.forEach(r => { [[r.a, r.ca], [r.b, r.cb]].forEach(([k, c]) => { if (!relCols.has(k)) relCols.set(k, new Set()); relCols.get(k).add(c); }); });
  const pos = new Map(); let maxH = 0;
  order.forEach((db, ci) => { let y = 40; groups[db].forEach(t => { const keys = [...(relCols.get(t.k) || [])]; const h = 30 + Math.max(1, keys.length) * 17 + 8; pos.set(t.k, {x: 16 + ci * (colW + gap), y, h, keys}); y += h + 22; }); maxH = Math.max(maxH, y); });
  const W = 16 + order.length * (colW + gap), H = maxH + 10;
  const colY = (p, c) => { const i = p.keys.indexOf(c); return p.y + 30 + (i < 0 ? 0 : i) * 17 + 8; };
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="核心业务底表 ER 图">`;
  order.forEach((db, ci) => { svg += `<text x="${16 + ci*(colW+gap)}" y="22" font-size="12" font-weight="600" fill="var(--muted)">${esc(db)}</text>`; });
  er.rels.forEach((r, i) => {
    const a = pos.get(r.a), b = pos.get(r.b); if (!a || !b) return;
    const ya = colY(a, r.ca), yb = colY(b, r.cb); let path;
    if (a.x === b.x) { const x1 = a.x + boxW, bulge = x1 + 34 + (i % 4) * 6; path = `M${x1} ${ya} C ${bulge} ${ya}, ${bulge} ${yb}, ${x1} ${yb}`; }
    else { const left = a.x < b.x ? [a, ya] : [b, yb], right = a.x < b.x ? [b, yb] : [a, ya]; const x1 = left[0].x + boxW, x2 = right[0].x, mx = (x1 + x2) / 2; path = `M${x1} ${left[1]} C ${mx} ${left[1]}, ${mx} ${right[1]}, ${x2} ${right[1]}`; }
    const code = r.kind === 'code';
    svg += `<path d="${path}" fill="none" stroke="${code ? 'var(--accent)' : 'var(--faint)'}" stroke-width="${code ? 1.8 : 1.2}" ${code ? '' : 'stroke-dasharray="5 4"'} opacity="${code ? .95 : .75}"><title>${esc(r.a)}.${esc(r.ca)} = ${esc(r.b)}.${esc(r.cb)} — ${code ? '代码 JOIN：' + esc((r.ev || []).join('; ')) : '按字段名推断' + (r.idx ? '（该字段有索引）' : '（该字段无索引）')}</title></path>`;
  });
  pos.forEach((p, k) => {
    const t = byKey.get(k);
    svg += `<g class="gnode" tabindex="0" role="button" data-go="${esc(k)}"><title>${esc(k)} ${esc(t ? t.c : '')}</title><rect x="${p.x}" y="${p.y}" width="${boxW}" height="${p.h}" rx="6" fill="var(--panel)" stroke="var(--line)"/><rect x="${p.x}" y="${p.y}" width="${boxW}" height="24" rx="6" fill="var(--accent-soft)"/><text x="${p.x+10}" y="${p.y+16}" font-size="12" font-weight="500" fill="var(--fg)">${esc(k.split('.')[1])}</text>`;
    p.keys.forEach((c, i) => { svg += `<text x="${p.x+12}" y="${p.y + 30 + i*17 + 12}" font-size="11" fill="var(--muted)">${esc(c)}</text>`; });
    svg += `</g>`;
  });
  svg += `</svg>`;
  const relRows = D.er.rels.slice().sort((x, y) => (x.kind === 'code' ? 0 : 1) - (y.kind === 'code' ? 0 : 1)).map(r => `<tr><td class="mono">${tlink(r.a)}.${esc(r.ca)}</td><td class="mono">${tlink(r.b)}.${esc(r.cb)}</td><td>${r.kind === 'code' ? `<span style="color:var(--accent)">代码 JOIN</span>` : `字段名推断${r.idx ? '（有索引）' : ''}`}</td><td class="mono" style="white-space:normal;font-size:12px">${esc((r.ev || []).join('；'))}</td></tr>`).join('');
  document.getElementById('main').innerHTML = `<div class="stack">
    <div><h1>核心业务底表 ER 图</h1><p class="lede">只画报表最常取数的 ${er.tables.length} 张业务底表，按库分列。MySQL 里没有外键，所以关系线分两种依据：实线是代码 SQL 里真实出现过的 JOIN（悬停看出处），虚线是按字段命名推断的关联，未经代码证实。框里只列参与关联的字段，完整字段点进表详情看。</p></div>
    <div class="legend"><span><svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" stroke="var(--accent)" stroke-width="2"/></svg> 代码 JOIN（有证据）</span><span><svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" stroke="var(--faint)" stroke-width="1.5" stroke-dasharray="5 4"/></svg> 字段名推断</span>${MC ? `<label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="ertenant" ${state.erTenant ? 'checked' : ''}> 显示 ${esc(MC)} 关联${hidden ? `（已隐藏 ${hidden} 条）` : ''}</label>` : ''}<span>没有外键的库里，多数关联在代码里逐条查询完成</span></div>
    <div class="graphwrap panel">${svg}</div>
    <div style="display:grid;gap:8px"><h2>关系清单（${D.er.rels.length}）</h2><div class="tablewrap"><table><thead><tr><th>表.字段</th><th>关联到</th><th>依据</th><th>代码出处</th></tr></thead><tbody>${relRows}</tbody></table></div></div>
  </div>`;
  const mch = document.getElementById('ertenant'); if (mch) mch.onchange = e => { state.erTenant = e.target.checked; renderER(); };
}

  let h = `<h2>本次运行</h2><dl class="kv" style="max-width:none"><dt>代码</dt><dd class="mono">${esc(m.repo || '')} · ${esc(m.branch || '')} · commit ${esc(m.commit || '')}${m.dirty ? '（工作区有未提交改动）' : ''}</dd><dt>元数据</dt><dd>${esc(m.source || '')}（${esc(m.source_mode || '')}，导出于 ${esc(m.exported_at || '')}）</dd><dt>生成时间</dt><dd>${esc(m.generated_at || '')}</dd></dl>`;

      <li>写入方或上游变化 ${d.changed.length}：${d.changed.slice(0, 20).map(k => tlink(k)).join('、') || '无'}${d.changed.length > 20 ? ' ……' : ''}</li>
      <li>字段变化 ${(d.schema || []).length}：${(d.schema || []).slice(0, 20).map(x => `${tlink(x[0])}（${x[1].length ? '新增 ' + esc(x[1].join(',')) : ''}${x[1].length && x[2].length ? '；' : ''}${x[2].length ? '删除 ' + esc(x[2].join(',')) : ''}）`).join('、') || '无'}</li>
      <li>状态变化 ${d.status.length}：${d.status.slice(0, 20).map(x => `${tlink(x[0])}（${esc(x[1] || '—')} → ${esc(x[2] || '—')}）`).join('、') || '无'}</li></ul>`;

  if (c.unresolved && c.unresolved.length) h += `<h3>代码里出现、但元数据里找不到的表（前 ${c.unresolved.length}）</h3><p class="note" style="margin:0">可能是 SQL 里的临时表、别名、换了库或元数据导出不全。</p><p class="mono" style="font-size:12px">${esc(c.unresolved.map(x => x[0] + '×' + x[1]).join('  '))}</p>`;
  return h;
}

    ${ACC.n_sets ? `<p>标准答案来自人工逐张读代码，由独立的核对者完成，核对时没有看过扫描结果。标为“调教集”的组在修复扫描器时被看过，成绩偏乐观；标为“独立核对”的组在修复完成后才拿到，代表对没见过的表的真实水平。表中除注明外都是召回率（标准答案里的条目被扫描找到的比例）。</p>
    <div class="tablewrap acc"><table><thead><tr><th>指标</th>${ACC.cols.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>${ACC.rows.map(r => accRow(r[0], r.slice(1))).join('')}</tbody></table></div>`
    : '<p style="color:var(--bad)">还没有标准答案，所以这份页面的准确率没有经过测量。建立方法见 skill 说明里的“标准答案”一节。</p>'}
    <p><b>上游表怎么看。</b>“直接上游”是 binlog 订阅/转发和 SQL 直接读到的表，精确率最高；“经 Feign 接口读”是调用别的服务接口时，在对方实现里几层以内（Controller → Service → Mapper）真正执行的查询，都是代码里真实发生的读取，但其中不少是接口顺带查询，人工核对通常只把主表算作上游，所以这一层只报召回、不报精确率；再深的读取单独折叠。</p>
    <ul>${ACC.notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul>
    <h2>已知盲区</h2>
    <ul>
      <li><b>只解析 MySQL</b>：MongoDB、Redis、ES 等存储的读写链路不会出现。</li>
      <li><b>动态表名</b>：SQL 用 \${tableName} 时，按调用方代码里的表名字面量推断，调用链里会标注。</li>
      <li><b>Feign 读取偏宽</b>：同名重载方法会一起算，接口实现里顺带查询的表也会出现；超过配置层数的读取单独折叠。</li>
      <li><b>一个入口分发多种事件</b>：扫描按整个入口归集读取，个别表的直接上游会偏多。</li>
      <li><b>RestTemplate / 拼 URL 的 HTTP 调用</b>不追踪${FLOW.xxl ? '；xxl-job 通过 URL 参数调接口，这层关系来自 xxl_job_info，而不是代码' : ''}。</li>
      <li><b>运行时条件</b>：@Conditional 会标出来，但页面不知道各环境实际部署了什么，配置中心里的开关取值也不知道。</li>
      <li><b>元数据来源</b>：行数、调度启用状态都来自 ${esc(SRC)}，其他环境可能不同。</li>
      ${ACC.blind_spots.map(n => `<li>${esc(n)}</li>`).join('')}
    </ul>
    <h2>状态怎么判定</h2>
    <ul>${STATUS.map(s => `<li><b>${s[0]}</b>：${s[2]}。</li>`).join('')}</ul>
    <h2>业务域怎么分</h2>
    <p>业务底表按所属库归类（库就是服务边界）。报表与中间表按表名、注释、写入类和上游表人工归到 ${DOMS.length} 个业务域。</p>
  </div></div>`;
}

/* ---------------- global search */
function searchAll(q){
  q = q.trim().toLowerCase(); if (q.length < 2) return null;
  const tables = T.filter(t => t.k.toLowerCase().includes(q) || (t.c || '').toLowerCase().includes(q)).sort((a, b) => (a.t.toLowerCase().startsWith(q) ? 0 : 1) - (b.t.toLowerCase().startsWith(q) ? 0 : 1) || (b.next + b.nint) - (a.next + a.nint)).slice(0, 8);
  const colHits = new Map();
  T.forEach(t => t.cols.forEach(c => { if (c[0].toLowerCase() === q || (q.length >= 4 && c[0].toLowerCase().includes(q))) { const key = c[0]; if (!colHits.has(key)) colHits.set(key, []); colHits.get(key).push(t); } }));
  const cols = [...colHits.entries()].sort((a, b) => (a[0].toLowerCase() === q ? 0 : 1) - (b[0].toLowerCase() === q ? 0 : 1) || b[1].length - a[1].length).slice(0, 4);
  const eps = q.includes('/') || q.length >= 4 ? D.eps.filter(([ix]) => E[ix].p.toLowerCase().includes(q)).slice(0, 6) : [];
  return {tables, cols, eps};
}
function renderSugg(){
  const box = document.getElementById('sugg'), q = document.getElementById('gq').value;
  const r = searchAll(q);
  if (!r || (!r.tables.length && !r.cols.length && !r.eps.length)) { box.innerHTML = r ? '<h4>没有找到</h4>' : ''; box.hidden = !r; return; }
  box.innerHTML = (r.tables.length ? `<h4>表</h4>${r.tables.map(t => `<button data-go="${esc(t.k)}"><span class="mono">${esc(t.k)}</span><span class="s2">${esc(t.kind)}${t.c ? ' · ' + esc(trim(t.c, 24)) : ''}</span></button>`).join('')}` : '')
    + (r.cols.length ? `<h4>字段</h4>${r.cols.map(([c, ts]) => `<button data-colsearch="${esc(c)}"><span class="mono">${esc(c)}</span><span class="s2">出现在 ${ts.length} 张表</span></button>`).join('')}` : '')
    + (r.eps.length ? `<h4>接口</h4>${r.eps.map(([ix, ts]) => `<button data-epsearch="${esc(E[ix].p)}"><span class="mono">${esc(E[ix].p)}</span><span class="s2">${esc(E[ix].m)} · 读 ${ts.length} 张表</span></button>`).join('')}` : '');
  box.hidden = false;
}
function showColumn(col){
  const ts = T.filter(t => t.cols.some(c => c[0] === col)).sort((a, b) => (a.kind === '业务底表') - (b.kind === '业务底表') || a.k.localeCompare(b.k));
  document.getElementById('main').innerHTML = `<div class="stack"><div><h1>字段 <span class="mono">${esc(col)}</span></h1><p class="lede">元数据里有 ${ts.length} 张逻辑表包含这个字段。点表名进入详情，字段会在“字段与索引”里高亮。</p></div>
    <div class="panel"><div class="tablewrap" style="border:none"><table><thead><tr><th>表</th><th>分类</th><th>类型</th><th>注释</th></tr></thead><tbody>${ts.map(t => { const c = t.cols.find(c => c[0] === col); return `<tr><td>${tlink(t.k)}</td><td><span class="dot" style="background:${kc(t.kind)}"></span> ${esc(t.kind)}</td><td class="mono">${esc(c[1])}</td><td>${esc(c[5])}</td></tr>`; }).join('')}</tbody></table></div></div></div>`;
  state.colHint = col; state.dtab = 'cols';
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', 'false'));
  window.scrollTo(0, 0);
}

/* ---------------- wiring */
document.addEventListener('click', e => {
  const unf = e.target.closest('[data-unfold]'); if (unf) { document.getElementById(unf.dataset.unfold).hidden = false; unf.remove(); return; }
  const go = e.target.closest('[data-go]'); if (go) { e.preventDefault(); document.getElementById('sugg').hidden = true; select(go.dataset.go, go.dataset.dt); return; }
  const dt = e.target.closest('[data-dtab]'); if (dt) { state.dtab = dt.dataset.dtab; renderDetail(); return; }
  const v = e.target.closest('[data-view]'); if (v && !v.classList.contains('tab')) { setView(v.dataset.view); return; }
  const cs = e.target.closest('[data-colsearch]'); if (cs) { document.getElementById('sugg').hidden = true; showColumn(cs.dataset.colsearch); return; }
  const es = e.target.closest('[data-epsearch]'); if (es) { document.getElementById('sugg').hidden = true; state.api = {tab: 'eps', q: es.dataset.epsearch, onlyReport: false, mod: ''}; setView('api'); return; }
  const cp = e.target.closest('[data-copy]');
  if (cp) { const txt = cp.dataset.copy; const done = () => { cp.textContent = '已复制'; setTimeout(() => cp.textContent = '复制', 1200); }; if (navigator.clipboard) navigator.clipboard.writeText(txt).then(done, () => {}); return; }
  const dom = e.target.closest('.dom[data-dom]');
  if (dom) { state.dom = dom.dataset.dom; state.kinds = new Set(dom.dataset.kind ? [dom.dataset.kind] : ['报表','中间表']); state.st = ''; state.q = ''; setView('catalog'); return; }
  if (!e.target.closest('.gs')) document.getElementById('sugg').hidden = true;
});
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.gnode[data-go]')) { e.preventDefault(); select(e.target.dataset.go, e.target.dataset.dt); } });
document.querySelectorAll('.tab[data-view]').forEach(b => b.onclick = () => setView(b.dataset.view));
const gq = document.getElementById('gq');
gq.addEventListener('input', () => { clearTimeout(gq.t); gq.t = setTimeout(renderSugg, 120); });
gq.addEventListener('focus', renderSugg);
gq.addEventListener('keydown', e => {
  const box = document.getElementById('sugg'), items = [...box.querySelectorAll('button')];
  if (e.key === 'Escape') { box.hidden = true; return; }
  if (!items.length) return;
  let i = items.findIndex(b => b.classList.contains('on'));
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); items.forEach(b => b.classList.remove('on')); i = e.key === 'ArrowDown' ? (i + 1) % items.length : (i <= 0 ? items.length - 1 : i - 1); items[i].classList.add('on'); items[i].scrollIntoView({block: 'nearest'}); }
  if (e.key === 'Enter') { e.preventDefault(); (items[i] || items[0]).click(); }
});

document.getElementById('brandmeta').textContent = `commit ${(D.meta || {}).commit || ''} · ${(D.meta || {}).source || ''} ${(D.meta || {}).exported_at || ''}`;
(function boot(){
  const h = decodeURIComponent(location.hash.slice(1));
  if (byKey.has(h)) { state.sel = h; setView('catalog', false); return; }
  if (['overview','catalog','api','issues','er','glossary','method'].includes(h)) { if (h === 'catalog') state.sel = M.example || null; setView(h, false); return; }
  setView('overview', false);
})();
</script>
